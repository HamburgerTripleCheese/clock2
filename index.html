<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cool Flip Clock</title>

    <!-- Tailwind CSS for modern utility styling -->

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts for typography -->

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">

    <style>

        body {

            font-family: 'Outfit', sans-serif;

            background: #0b0f17;

            user-select: none;

        }



        .flip-clock {

            display: flex;

            gap: 8px;

            align-items: center;

        }



        @media (min-width: 640px) {

            .flip-clock {

                gap: 16px;

            }

        }



        .flip-card {

            position: relative;

            width: 70px;

            height: 105px;

            font-size: 68px;

            font-weight: 700;

            perspective: 400px;

            border-radius: 12px;

            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);

            background-color: #121824;

        }



        @media (min-width: 640px) {

            .flip-card {

                width: 100px;

                height: 150px;

                font-size: 96px;

                border-radius: 16px;

            }

        }



        .card-half {

            position: absolute;

            left: 0;

            width: 100%;

            height: 50%;

            overflow: hidden;

            background-color: #1a2234;

            color: #f8fafc;

            display: flex;

            justify-content: center;

            backface-visibility: hidden;

        }



        .card-half.top {

            top: 0;

            align-items: flex-end;

            border-top-left-radius: inherit;

            border-top-right-radius: inherit;

            border-bottom: 1px solid rgba(0, 0, 0, 0.7);

        }



        .card-half.top span {

            transform: translateY(50%);

        }



        .card-half.bottom {

            bottom: 0;

            align-items: flex-start;

            border-bottom-left-radius: inherit;

            border-bottom-right-radius: inherit;

            border-top: 1px solid rgba(255, 255, 255, 0.08);

        }



        .card-half.bottom span {

            transform: translateY(-50%);

        }



        .flipper {
            position: absolute;
            inset: 0;
            z-index: 10;
            pointer-events: none;
            perspective: 500px;
        }

        .flip-leaf {
            position: absolute;
            left: 0;
            width: 100%;
            height: 50%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            background-color: #1a2234;
            color: #f8fafc;
            will-change: transform, filter;
        }

        /* Old digit: the upper half folds away first. */
        .flip-leaf.front {
            top: 0;
            align-items: flex-end;
            border-top-left-radius: inherit;
            border-top-right-radius: inherit;
            border-bottom: 1px solid rgba(0, 0, 0, 0.7);
            transform-origin: bottom center;
            transform: rotateX(0deg);
            z-index: 3;
        }

        .flip-leaf.front span {
            transform: translateY(50%);
        }

        /* New digit: the lower half starts edge-on, then opens downward. */
        .flip-leaf.back {
            bottom: 0;
            align-items: flex-start;
            border-bottom-left-radius: inherit;
            border-bottom-right-radius: inherit;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            transform-origin: top center;
            transform: rotateX(90deg);
            z-index: 4;
        }

        .flip-leaf.back span {
            transform: translateY(-50%);
        }

        .flip-card.flipping .flip-leaf.front {
            animation: flipTop 0.22s cubic-bezier(0.45, 0, 0.55, 1) forwards;
        }

        .flip-card.flipping .flip-leaf.back {
            animation: flipBottom 0.24s 0.22s cubic-bezier(0.2, 0.65, 0.25, 1) forwards;
        }

        @keyframes flipTop {
            0% {
                transform: rotateX(0deg);
                filter: brightness(1);
                box-shadow: 0 0 0 rgba(0, 0, 0, 0);
            }
            100% {
                transform: rotateX(-90deg);
                filter: brightness(0.58);
                box-shadow: 0 10px 18px rgba(0, 0, 0, 0.35);
            }
        }

        @keyframes flipBottom {
            0% {
                transform: rotateX(90deg);
                filter: brightness(0.58);
                box-shadow: 0 -8px 16px rgba(0, 0, 0, 0.30);
            }
            100% {
                transform: rotateX(0deg);
                filter: brightness(1);
                box-shadow: 0 0 0 rgba(0, 0, 0, 0);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .flip-card.flipping .flip-leaf.front,
            .flip-card.flipping .flip-leaf.back {
                animation-duration: 0.01ms;
                animation-delay: 0ms;
            }
        }

        .glass-panel {

            background: rgba(15, 23, 42, 0.75);

            backdrop-filter: blur(16px);

            -webkit-backdrop-filter: blur(16px);

            border: 1px solid rgba(255, 255, 255, 0.12);

        }

    </style>

</head>

<body class="min-h-screen flex flex-col justify-between items-center text-white p-6 overflow-x-hidden">



    <header class="w-full max-w-5xl flex flex-col sm:flex-row justify-between items-center gap-4 z-10">

        <div id="date-display" class="text-xl sm:text-2xl font-semibold tracking-wide drop-shadow-md text-slate-100 italic">

            Saturday, October 3, 2026, am

        </div>

        <div class="flex items-center gap-3">

            <button id="format-btn" class="px-4 py-2 rounded-xl glass-panel text-sm font-medium hover:bg-slate-800/80 transition shadow-lg cursor-pointer">

                24H Format

            </button>

        </div>

    </header>



    <main class="flex flex-col items-center justify-center my-auto z-10">

        <div class="flex items-center gap-2 sm:gap-4 md:gap-6 p-6 sm:p-10 rounded-3xl glass-panel shadow-2xl">



            <!-- Hours Component -->

            <div class="flip-clock">

                <div class="flip-card" id="hour-tens">

                    <div class="card-half top"><span class="val-top">0</span></div>

                    <div class="card-half bottom"><span class="val-bot">0</span></div>

                    <div class="flipper">

                        <div class="flip-leaf front"><span class="val-front">0</span></div>

                        <div class="flip-leaf back"><span class="val-back">0</span></div>

                    </div>

                </div>

                <div class="flip-card" id="hour-ones">

                    <div class="card-half top"><span class="val-top">0</span></div>

                    <div class="card-half bottom"><span class="val-bot">0</span></div>

                    <div class="flipper">

                        <div class="flip-leaf front"><span class="val-front">0</span></div>

                        <div class="flip-leaf back"><span class="val-back">0</span></div>

                    </div>

                </div>

            </div>



            <!-- Colon 1 -->

            <div class="flex flex-col gap-3 sm:gap-4 justify-center items-center py-2">

                <div class="w-2.5 h-2.5 sm:w-3.5 sm:h-3.5 bg-slate-200 rounded-full shadow-lg animate-pulse"></div>

                <div class="w-2.5 h-2.5 sm:w-3.5 sm:h-3.5 bg-slate-200 rounded-full shadow-lg animate-pulse"></div>

            </div>



            <!-- Minutes Component -->

            <div class="flip-clock">

                <div class="flip-card" id="min-tens">

                    <div class="card-half top"><span class="val-top">0</span></div>

                    <div class="card-half bottom"><span class="val-bot">0</span></div>

                    <div class="flipper">

                        <div class="flip-leaf front"><span class="val-front">0</span></div>

                        <div class="flip-leaf back"><span class="val-back">0</span></div>

                    </div>

                </div>

                <div class="flip-card" id="min-ones">

                    <div class="card-half top"><span class="val-top">0</span></div>

                    <div class="card-half bottom"><span class="val-bot">0</span></div>

                    <div class="flipper">

                        <div class="flip-leaf front"><span class="val-front">0</span></div>

                        <div class="flip-leaf back"><span class="val-back">0</span></div>

                    </div>

                </div>

            </div>



            <!-- Colon 2 -->

            <div class="flex flex-col gap-3 sm:gap-4 justify-center items-center py-2">

                <div class="w-2.5 h-2.5 sm:w-3.5 sm:h-3.5 bg-slate-200 rounded-full shadow-lg animate-pulse"></div>

                <div class="w-2.5 h-2.5 sm:w-3.5 sm:h-3.5 bg-slate-200 rounded-full shadow-lg animate-pulse"></div>

            </div>



            <!-- Seconds Component -->

            <div class="flip-clock">

                <div class="flip-card" id="sec-tens">

                    <div class="card-half top"><span class="val-top">0</span></div>

                    <div class="card-half bottom"><span class="val-bot">0</span></div>

                    <div class="flipper">

                        <div class="flip-leaf front"><span class="val-front">0</span></div>

                        <div class="flip-leaf back"><span class="val-back">0</span></div>

                    </div>

                </div>

                <div class="flip-card" id="sec-ones">

                    <div class="card-half top"><span class="val-top">0</span></div>

                    <div class="card-half bottom"><span class="val-bot">0</span></div>

                    <div class="flipper">

                        <div class="flip-leaf front"><span class="val-front">0</span></div>

                        <div class="flip-leaf back"><span class="val-back">0</span></div>

                    </div>

                </div>

            </div>

            <!-- AM/PM Indicator -->
            <div id="ampm-indicator" class="self-end mb-2 sm:mb-3 ml-1 sm:ml-2 text-lg sm:text-2xl tracking-widest font-bold uppercase text-slate-300 drop-shadow whitespace-nowrap">
                AM
            </div>

        </div>

    </main>


    <script>

                let is24Hour = false;

        const formatBtn = document.getElementById('format-btn');

        const ampmIndicator = document.getElementById('ampm-indicator');



        formatBtn.addEventListener('click', () => {

            is24Hour = !is24Hour;

            formatBtn.textContent = is24Hour ? "12H Format" : "24H Format";

            ampmIndicator.classList.toggle('hidden', is24Hour);

            updateClock(true);

        });



        // Set initial digit values instantly without animation

        function setDigitInstant(cardId, val) {

            const card = document.getElementById(cardId);

            if (!card) return;

            card.querySelector('.val-top').textContent = val;

            card.querySelector('.val-bot').textContent = val;

            card.querySelector('.val-front').textContent = val;

            card.querySelector('.val-back').textContent = val;

        }



        // Perform a natural two-stage mechanical flip from oldVal to newVal
        function flipDigit(cardId, newVal) {
            const card = document.getElementById(cardId);
            if (!card) return;

            const topHalf = card.querySelector('.val-top');
            const botHalf = card.querySelector('.val-bot');
            const frontLeaf = card.querySelector('.val-front');
            const backLeaf = card.querySelector('.val-back');

            const currentVal = topHalf.textContent;
            newVal = String(newVal);
            if (currentVal === newVal) return;

            // Make sure no previous animation state can cause a reverse bounce.
            card.classList.remove('flipping');

            // Behind the moving leaves:
            // - the new top is ready immediately
            // - the old bottom stays visible until the halfway point
            topHalf.textContent = newVal;
            botHalf.textContent = currentVal;

            // Moving leaves carry the old upper half and new lower half.
            frontLeaf.textContent = currentVal;
            backLeaf.textContent = newVal;

            // Restart the keyframes reliably.
            void card.offsetWidth;
            card.classList.add('flipping');

            // At 90 degrees both moving leaves are edge-on, so swap the static bottom.
            setTimeout(() => {
                botHalf.textContent = newVal;
            }, 220);

            // Put every layer on the final value BEFORE removing the animation class.
            // This prevents the leaf from visibly snapping or animating backwards.
            setTimeout(() => {
                topHalf.textContent = newVal;
                botHalf.textContent = newVal;
                frontLeaf.textContent = newVal;
                backLeaf.textContent = newVal;
                card.classList.remove('flipping');
            }, 470);
        }

        let isInitial = true;



        function updateClock(force = false) {

            const now = new Date();

            let hours = now.getHours();

            const minutes = now.getMinutes();

            const seconds = now.getSeconds();



            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };

            let dateStr = now.toLocaleDateString('en-US', options);

            let ampmStr = '';



            if (!is24Hour) {

                ampmStr = hours >= 12 ? 'pm' : 'am';

                hours = hours % 12;

                hours = hours ? hours : 12;

                ampmIndicator.textContent = ampmStr;
                ampmIndicator.classList.remove('hidden');

            } else {
                ampmIndicator.classList.add('hidden');
            }



            document.getElementById('date-display').textContent = dateStr;



            const hStr = String(hours).padStart(2, '0');

            const mStr = String(minutes).padStart(2, '0');

            const sStr = String(seconds).padStart(2, '0');



            if (isInitial || force) {

                setDigitInstant('hour-tens', hStr[0]);

                setDigitInstant('hour-ones', hStr[1]);

                setDigitInstant('min-tens', mStr[0]);

                setDigitInstant('min-ones', mStr[1]);

                setDigitInstant('sec-tens', sStr[0]);

                setDigitInstant('sec-ones', sStr[1]);

                isInitial = false;

            } else {

                flipDigit('hour-tens', hStr[0]);

                flipDigit('hour-ones', hStr[1]);

                flipDigit('min-tens', mStr[0]);

                flipDigit('min-ones', mStr[1]);

                flipDigit('sec-tens', sStr[0]);

                flipDigit('sec-ones', sStr[1]);

            }

        }



        setInterval(updateClock, 1000);

        updateClock(true);

    </script>

</body>

</html>
